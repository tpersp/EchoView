<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>EchoView YouTube Player</title>
  <style>html,body{margin:0;background:#000;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style>
</head>
<body>
  <iframe src="{{ embed_url }}" title="YouTube video player"
    allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</body>
</html>
