<details class="spotify-preview" data-display="{{ dname }}" data-url="{{ url_for('main.spotify_now_playing') }}" data-resolution="{{ output.resolution|default('1280x720') }}" data-aspect="{{ dcfg.get('display_aspect','auto') }}">
  <summary>Preview before applying</summary>
  <div class="spotify-preview-screen" data-preview-screen aria-label="Spotify layout preview">
    <div class="spotify-preview-blur" aria-hidden="true" hidden></div>
    <div class="spotify-preview-content"><div class="spotify-preview-art"><span aria-hidden="true">♫</span><img alt="Preview artwork" hidden></div><div class="spotify-preview-info"><div data-preview-song></div><div data-preview-artist></div><div data-preview-album></div><div data-preview-device></div></div></div>
    <div class="spotify-preview-progress"><span></span></div>
    <div class="spotify-preview-time" data-preview-time hidden></div>
  </div>
  <p class="help-text" data-preview-note>Example track</p>
</details>
